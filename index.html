  // 달 데이터: { incomes: [{ id, name, amount, received }], items: [...], carry?: 직접 입력한 이월 금액 }
  // 예전 형식 { income: 숫자 } 는 '수입' 한 건(들어옴)으로 바꾼다
  function normalizeMonth(ym, mo) {
    if (!Array.isArray(mo.items)) mo.items = [];
    if (!Array.isArray(mo.incomes)) {
      mo.incomes = Number(mo.income) > 0
        ? [{ id: `inc-${ym}`, name: '수입', amount: Math.round(Number(mo.income)), received: true }]
        : [];
    }
    delete mo.income;
    return mo;
  }

  function isEmptyMonth(mo) {
    return !mo.items.length && !mo.incomes.length && typeof mo.carry !== 'number';
  }

  // 보고 있는 달 데이터를 저장. 수입·항목·이월이 모두 없는 달은 남기지 않는다
  function saveItems() {
    curMonth.items = items;
    curMonth.incomes = incomes;
    if (isEmptyMonth(curMonth)) delete months[currentMonth];
    else months[currentMonth] = curMonth;
    safeSet(MONTHS_KEY, JSON.stringify(months));
  }

  // 년월
  function todayMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function selectMonth(ym) {
    if (!/^\d{4}-\d{2}$/.test(ym)) return;
    if (ym !== currentMonth) selectedDay = ym === todayMonth() ? new Date().getDate() : null;
    currentMonth = ym;
    curMonth = months[ym] || { incomes: [], items: [] };
    items = curMonth.items;
    incomes = curMonth.incomes;

    const [y, m] = ym.split('-');
    $('monthText').innerText = `${y}년 ${parseInt(m, 10)}월`;
    $('monthSub').innerText = ym === todayMonth() ? '이번 달' : '';
    $('monthPicker').value = ym;
    render();
  }

  function shiftMonth(delta) {
    const [y, m] = currentMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    selectMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }

  // 현재 달보다 앞선 달 중 데이터가 있는 가장 가까운 달
  function previousMonthWithData() {
    const keys = Object.keys(months).filter(k => k < currentMonth).sort();
    return keys.length ? keys[keys.length - 1] : null;
  }

  // 이전 달의 수입과 고정 지출을 체크 해제 상태로 복사.
  // 이미 같은 이름의 고정 지출이 있으면 건너뛰고, 수입은 비어 있을 때만 채운다
  function copyFromPrevious() {
    const prev = previousMonthWithData();
    if (!prev) return 0;
    rememberForUndo();
    const src = months[prev];
    const has = new Set(items.filter(it => it.type === 'fixed').map(repeatKey));
    const [y, m] = currentMonth.split('-');
    const base = Date.now();
    const copied = src.items
      .filter(it => it.type === 'fixed' && !has.has(repeatKey(it)))
      .map((it, i) => ({
        ...it,
        id: `${base}-${i}`,
        checked: false,
        paidIn: undefined,  // 카드값을 낸 기록은 가져오지 않는다
        // 같은 날짜(일)로 옮기되, 그 달에 없는 날(31일 등)은 말일로
        date: `${y}-${m}-${String(Math.min(parseInt((it.date || '').slice(8), 10) || 1, daysInMonth(currentMonth))).padStart(2, '0')}`
      }));
    items = copied.concat(items);
    // 수입은 비어 있을 때만 가져오고, 새 달이니 '들어옴' 체크는 푼다
    let copiedIncomes = 0;
    if (!incomes.length) {
      incomes = (src.incomes || []).map((x, i) => ({ ...x, id: `${base}-i${i}`, received: false }));
      copiedIncomes = incomes.length;
    }
    saveItems();
    render();
    if (copied.length || copiedIncomes) {
      offerUndo(`${monthName(prev)}에서 고정 지출 ${copied.length}개${copiedIncomes ? `·수입 ${copiedIncomes}건` : ''} 가져옴`);
    } else {
      showToast('새로 가져올 고정 지출이 없습니다');
    }
    return copied.length;
  }

  function menuCopyFromPrevious() {
    closeSheets();
    if (!previousMonthWithData()) { showToast('가져올 이전 달 데이터가 없습니다'); return; }
    copyFromPrevious();
  }

  // ── 백업 ──
  // 모든 달의 데이터를 .json 파일 하나로 내려받는다
  function exportBackup() {
    const backup = { app: 'check-budget', version: 2, exportedAt: new Date().toISOString(), months, members };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const t = new Date();
    const stamp = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `가계부_백업_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    closeSheets();  // 다운로드를 시작한 뒤에 메뉴 기록을 되돌린다
  }

  // 백업 파일을 읽어서 지금 데이터를 통째로 바꾼다
  function importBackup(file) {
    closeSheets();
    const reader = new FileReader();
    reader.onload = () => {
      let data, raw;
      try {
        raw = JSON.parse(reader.result);
        data = parseBackup(raw);
      } catch (e) {
        alert('백업 파일을 읽을 수 없습니다.\n가계부에서 내보낸 .json 파일인지 확인해 주세요.');
        return;
      }
      const keys = Object.keys(data).sort();
      const count = keys.reduce((s, k) => s + data[k].items.length, 0);
      const range = keys.length ? `${keys[0]} ~ ${keys[keys.length - 1]}` : '없음';
      if (!confirm(`백업을 불러올까요?\n\n기간: ${range} (${keys.length}개월)\n항목: ${count}개\n\n⚠️ 지금 이 기기에 있는 가계부 내용은 모두 백업 내용으로 바뀝니다.`)) return;
      months = data;
      safeSet(MONTHS_KEY, JSON.stringify(months));
      // 구매자 이름도 백업에 있으면 함께 가져온다
      const mem = Array.isArray(raw.members)
        ? raw.members.filter(m => m && typeof m.id === 'string' && typeof m.name === 'string' && m.name.trim())
          .map(m => ({ id: m.id, name: m.name.trim() }))
        : [];
      if (mem.length) {
        members = mem;
        saveMembers();
      }
      selectMonth(currentMonth);
      alert('불러오기를 마쳤습니다.');
    };
    reader.onerror = () => alert('파일을 열 수 없습니다.');
    reader.readAsText(file);
  }

  // 형식이 맞는 달·항목만 남긴다. 형식이 아예 다르면 예외를 던진다
  function parseBackup(raw) {
    const src = raw && raw.app === 'check-budget' ? raw.months : null;
    if (!src || typeof src !== 'object') throw new Error('not a backup');
    const out = {};
    Object.entries(src).forEach(([ym, mo]) => {
      if (!/^\d{4}-\d{2}$/.test(ym) || !mo || !Array.isArray(mo.items)) return;
      const list = mo.items
        .filter(it => it && typeof it.name === 'string' && Number(it.amount) > 0)
        .map((it, i) => ({
          id: String(it.id || `${Date.now()}-${ym}-${i}`),
          type: it.type === 'fixed' ? 'fixed' : 'variable',
          name: it.name,
          amount: Math.round(Number(it.amount)),
          category: typeof it.category === 'string' ? it.category : '기타',
          checked: !!it.checked,
          date: /^\d{4}-\d{2}-\d{2}$/.test(it.date || '') ? it.date : `${ym}-01`,
          ...(it.card ? { card: true } : {}),
          ...(it.card && /^\d{4}-\d{2}$/.test(it.paidIn || '') ? { paidIn: it.paidIn } : {}),
          ...(it.refund ? { refund: true } : {}),
          ...(typeof it.who === 'string' && /^[\w-]+$/.test(it.who) ? { who: it.who } : {})
        }));
      // 수입: 새 형식(incomes 목록) 또는 예전 형식(income 숫자)
      const incs = Array.isArray(mo.incomes)
        ? mo.incomes
          .filter(x => x && typeof x.name === 'string' && Number(x.amount) > 0)
          .map((x, i) => ({ id: String(x.id || `${Date.now()}-${ym}-i${i}`), name: x.name, amount: Math.round(Number(x.amount)), received: !!x.received }))
        : (Number(mo.income) > 0 ? [{ id: `inc-${ym}`, name: '수입', amount: Math.round(Number(mo.income)), received: true }] : []);
      const carry = typeof mo.carry === 'number' && isFinite(mo.carry) ? Math.round(mo.carry) : null;
      if (list.length || incs.length || carry !== null) {
        out[ym] = { incomes: incs, items: list, ...(carry !== null ? { carry } : {}) };
      }
    });
    return out;
  }

  function daysInMonth(ym) {
    const [y, m] = ym.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }

  // ── 반복 주기 ──
  // 이름이 같은 변동 지출을 같은 항목으로 보고(금액은 달라도 됨), 날짜 간격의 평균을 주기로 쓴다.
  // 대소문자와 띄어쓰기 차이는 무시한다
  function nameKey(name) { return String(name || '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function repeatKey(it) { return nameKey(it.name); }

  function dayNum(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return Date.UTC(y, m - 1, d) / 86400000;
  }

  function buildRepeatMap() {
    const groups = {};
    Object.values(months).forEach(mo => (mo.items || []).forEach(it => {
      if (it.type !== 'variable' || it.refund || !/^\d{4}-\d{2}-\d{2}$/.test(it.date || '')) return;
      (groups[repeatKey(it)] = groups[repeatKey(it)] || []).push({ day: dayNum(it.date), amount: it.amount });
    }));

    const map = {};
    Object.entries(groups).forEach(([key, list]) => {
      list.sort((a, b) => a.day - b.day);
      const days = [...new Set(list.map(x => x.day))];  // 같은 날 두 번은 한 번으로
      if (days.length < 2) return;
      const gaps = days.slice(1).map((d, i) => d - days[i]);
      const avg = Math.round(gaps.reduce((s, g) => s + g, 0) / gaps.length);
      const amounts = list.map(x => x.amount);
      map[key] = {
        avg,
        count: days.length,
        last: days[days.length - 1],
        lastAmount: amounts[amounts.length - 1],
        minAmount: Math.min(...amounts),
        maxAmount: Math.max(...amounts)
      };
    });
    return map;
  }

  function cycleText(avg) {
    if (avg >= 26 && avg <= 34) return '매달';
    if (avg === 7) return '매주';
    return `${avg}일마다`;
  }

  function dayToLabel(n) {
    const d = new Date(n * 86400000);
    return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  }

  function showRepeat(id, e) {
    e.stopPropagation();
    const found = findItem(id);
    const it = found && found.it;
    const r = it && buildRepeatMap()[repeatKey(it)];
    if (!r) return;
    const amountLine = r.minAmount === r.maxAmount
      ? `금액 ${won(r.minAmount)}`
      : `금액 ${won(r.minAmount)} ~ ${won(r.maxAmount)} (최근 ${won(r.lastAmount)})`;
    const msg = `'${it.name}'\n\n` +
      `${r.count}번 입력됨 · 평균 ${r.avg}일 간격\n` +
      `${amountLine}\n` +
      `마지막 ${dayToLabel(r.last)} → 다음 예상 ${dayToLabel(r.last + r.avg)}쯤`;

    // 한 달 간격으로 반복되면 고정 지출로 옮길지 묻는다
    if (r.avg >= 26 && r.avg <= 34) {
      if (confirm(msg + '\n\n매달 나가는 지출이에요. 이 항목을 고정 지출로 옮길까요?')) {
        it.type = 'fixed';
        if (!categoriesFixed.includes(it.category)) it.category = '기타';
        saveItems();
        render();
      }
    } else {
      alert(msg);
    }
  }

  // 입력하는 중에 같은 항목이 전에 있었으면 간격을 바로 보여준다
  function updateRepeatHint() {
    const hint = $('repeatHint');
    if (editingId) {  // 수정 중인 항목 자신과 비교하게 되므로 보여주지 않는다
      hint.innerText = '';
      return;
    }
    const name = $('nameInput').value.trim();
    const date = $('dateInput').value;
    hint.innerText = '';
    if (inputType !== 'variable' || inputRefund || !name || !date) return;

    const key = nameKey(name);
    let lastBefore = null;
    Object.values(months).forEach(mo => (mo.items || []).forEach(it => {
      if (it.type === 'variable' && !it.refund && repeatKey(it) === key && it.date && it.date <= date) {
        if (!lastBefore || it.date > lastBefore.date) lastBefore = it;
      }
    }));
    if (!lastBefore) return;
    const gap = dayNum(date) - dayNum(lastBefore.date);
    hint.innerText = gap === 0
      ? `🔁 같은 날 이미 입력한 항목이에요 (${won(lastBefore.amount)})`
      : `🔁 지난번 ${dayToLabel(dayNum(lastBefore.date))} ${won(lastBefore.amount)} 이후 ${gap}일 만이에요`;
  }

  function won(n) { return '₩' + (Number(n) || 0).toLocaleString('ko-KR'); }
  function signedWon(n) { return (n < 0 ? '-' : '') + won(Math.abs(n)); }
  function plusWon(n) { return (n > 0 ? '+' : '') + signedWon(n); }
  // 환불 항목은 돈이 돌아오는 것이라 계산할 때 마이너스로 센다
  function val(it) { return it.refund ? -it.amount : it.amount; }
  function sumVal(list) { return list.reduce((s, it) => s + val(it), 0); }
  // 달력 칸에 들어갈 짧은 금액: 52,000 → 5.2만, 8,700 → 8.7천
  function shortWon(n) {
    const a = Math.abs(n), sign = n < 0 ? '-' : '';
    if (a >= 10000) return sign + (a >= 1000000 ? Math.round(a / 10000) : +(a / 10000).toFixed(1)) + '만';
    if (a >= 1000) return sign + +(a / 1000).toFixed(1) + '천';
    return sign + a;
  }
  function onlyDigits(s) { return s.replace(/[^0-9]/g, ''); }

  function setupInputs() {
    // 금액 칸은 입력하는 대로 1,000 단위 쉼표를 붙인다
    ['amtInput', 'incAmt', 'carryInput'].forEach(id => $(id).addEventListener('input', e => {
      const raw = onlyDigits(e.target.value);
      e.target.value = raw ? parseInt(raw, 10).toLocaleString('ko-KR') : '';
    }));
    $('carryInput').addEventListener('change', saveCarryInput);
    $('incAmt').addEventListener('keydown', e => { if (e.key === 'Enter') saveIncome(); });
    $('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    $('monthPicker').addEventListener('change', e => selectMonth(e.target.value));

    $('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      e.target.value = '';  // 같은 파일을 다시 골라도 change 가 일어나게
      if (file) importBackup(file);
    });

    $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('amtInput').focus(); });
    $('amtInput').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    ['nameInput', 'amtInput', 'dateInput'].forEach(id => {
      $(id).addEventListener('input', updateRepeatHint);
      $(id).addEventListener('change', updateRepeatHint);
    });
  }

  // 시트
  // 입력창·메뉴를 열 때 기록을 하나 쌓아서, 뒤로 가기를 누르면 창만 닫히게 한다
  function openSheet(id) {
    armBackGuard();
    if (!isState('sheet')) history.pushState({ budget: 'sheet' }, '');
    $('backdrop').classList.add('open');
    $(id).classList.add('open');
  }
  function hideSheets() {
    editingId = null;
    $('backdrop').classList.remove('open');
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    document.activeElement && document.activeElement.blur();
  }
  // 화면에서 직접 닫을 때(바깥 누르기, 추가, 메뉴 실행)는 열면서 쌓은 기록도 되돌린다
  function closeSheets() {
    hideSheets();
    if (isState('sheet')) {
      poppingSheet = true;
      history.back();
    }
  }
  function openAddSheet() {
    editingId = null;
    $('sheetTitle').innerText = '새 항목';
    $('deleteBtn').hidden = true;
    if (formFromEdit) {  // 수정하던 항목 내용은 비운다
      $('nameInput').value = '';
      $('amtInput').value = '';
      formFromEdit = false;
      if (currentTab !== 'fixed' && currentTab !== 'variable') setInputType(inputType);  // 버튼 글자를 '추가'로 되돌린다
    }
    // 고정/변동 탭이면 그 종류로, 카드 탭이면 신용카드로 바로 추가. 아니면 마지막에 고른 결제수단
    if (currentTab === 'fixed' || currentTab === 'variable') setInputType(currentTab);
    setPayCard(currentTab === 'card' || safeGet(PAY_KEY) === 'card', false);
    setRefund(false);
    setWho(safeGet(WHO_KEY), false);
    // 날짜는 보고 있는 달 안에서만 고르게 하고, 이번 달이면 오늘을 기본값으로
    const dateEl = $('dateInput');
    const today = new Date();
    const todayIso = `${todayMonth()}-${String(today.getDate()).padStart(2, '0')}`;
    dateEl.min = `${currentMonth}-01`;
    dateEl.max = `${currentMonth}-${String(daysInMonth(currentMonth)).padStart(2, '0')}`;
    // 달력에서 날짜를 골라 둔 상태면 그 날짜로
    dateEl.value = viewMode === 'calendar' && selectedDay
      ? `${currentMonth}-${String(Math.min(selectedDay, daysInMonth(currentMonth))).padStart(2, '0')}`
      : (currentMonth === todayMonth() ? todayIso : dateEl.min);
    renderRecent();
    updateRepeatHint();
    openSheet('addSheet');
    setTimeout(() => $('nameInput').focus(), 250);
  }

  function setInputType(type) {
    inputType = type;
    $('typeVar').classList.toggle('active', type === 'variable');
    $('typeFixed').classList.toggle('active', type === 'fixed');
    updateSubmitLabel();

    const cats = type === 'fixed' ? categoriesFixed : categoriesVariable;
    selectedCategory = cats[0];
    const box = $('catChips');
    box.innerHTML = '';
    cats.forEach((cat, i) => {
      const b = document.createElement('button');
      b.className = 's-chip' + (i === 0 ? ' active' : '');
      b.innerText = cat;
      b.onclick = () => {
        box.querySelectorAll('.s-chip').forEach(c => c.classList.remove('active'));
        b.classList.add('active');
        selectedCategory = cat;
      };
      box.appendChild(b);
    });
    renderRecent();
    updateRepeatHint();
  }

  function selectCategory(cat) {
    const cats = inputType === 'fixed' ? categoriesFixed : categoriesVariable;
    selectedCategory = cats.includes(cat) ? cat : cats[cats.length - 1];
    $('catChips').querySelectorAll('.s-chip').forEach(c => c.classList.toggle('active', c.innerText === selectedCategory));
  }

  // 지금 고른 종류(고정/변동)로 최근에 입력한 항목. 이름이 같으면 가장 최근 것 하나만
  function recentItems(limit = 10) {
    const all = [];
    Object.values(months).forEach(mo => (mo.items || []).forEach(it => {
      if (it.type === inputType && !it.refund) all.push(it);
    }));
    // 날짜가 늦은 순, 같은 날이면 나중에 만든 것(id가 큰 것) 먼저
    all.sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(String(a.id)));
    const seen = new Set();
    const out = [];
    for (const it of all) {
      const k = nameKey(it.name);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(it);
      if (out.length >= limit) break;
    }
    return out;
  }

  function renderRecent() {
    if (editingId) {  // 수정할 때는 최근 항목을 보여주지 않는다
      $('recentWrap').classList.add('hidden');
      return;
    }
    const list = recentItems();
    $('recentWrap').classList.toggle('hidden', !list.length);
    const row = $('recentChips');
    row.innerHTML = '';
    list.forEach(it => {
      const b = document.createElement('button');
      b.className = 'recent-chip';
      b.innerHTML = `<b>${escapeHtml(it.name)}</b><small>${it.card ? '💳 ' : ''}${won(it.amount)}</small>`;
      b.onclick = () => {
        $('nameInput').value = it.name;
        $('amtInput').value = it.amount.toLocaleString('ko-KR');
        selectCategory(it.category);
        setPayCard(!!it.card);
        updateRepeatHint();
      };
      row.appendChild(b);
    });
  }

  function addAmount(n) {
    const cur = parseInt(onlyDigits($('amtInput').value), 10) || 0;
    $('amtInput').value = (cur + n).toLocaleString('ko-KR');
  }
  function clearAmount() { $('amtInput').value = ''; }

  // 결제수단: 현금·체크카드 / 신용카드
  function setPayCard(on, remember = true) {
    inputCard = on;
    $('payCash').classList.toggle('active', !on);
    $('payCard').classList.toggle('active', on);
    if (remember && !editingId) safeSet(PAY_KEY, on ? 'card' : 'cash');
  }

  // 환불: 돈이 돌아오는 항목. 금액은 그대로 적고 계산할 때 마이너스로 센다
  function setRefund(on) {
    inputRefund = on;
    $('refundBtn').classList.toggle('active', on);
    updateSubmitLabel();
    updateRepeatHint();
  }

  // ── 구매자(누가 샀는지) ──
  // 이름을 바꿔도 항목과 연결이 유지되게 항목에는 id 를 저장한다
  function loadMembers() {
    try { members = JSON.parse(safeGet(MEMBERS_KEY) || 'null'); } catch (e) { members = null; }
    if (!Array.isArray(members) || !members.length) {
      members = [{ id: 'm1', name: '나' }, { id: 'm2', name: '배우자' }];
    }
  }
  function saveMembers() { safeSet(MEMBERS_KEY, JSON.stringify(members)); }
  function memberName(id) {
    const m = id && members.find(x => x.id === id);
    return m ? m.name : '';
  }

  // 고른 사람을 다시 누르면 선택이 풀린다(고르지 않아도 된다)
  function setWho(id, remember = true) {
    inputWho = id && members.some(m => m.id === id) ? id : null;
    if (remember && !editingId) safeSet(WHO_KEY, inputWho || '');
    $('whoChips').innerHTML = members.map(m => `
      <button class="s-chip ${m.id === inputWho ? 'active' : ''}" onclick="setWho(${m.id === inputWho ? 'null' : `'${m.id}'`})">${escapeHtml(m.name)}</button>`).join('');
  }

  // 이름은 쉼표로 구분해 한 번에 고친다. 순서대로 기존 사람과 이어져서, 이미 적은 항목의 이름도 같이 바뀐다
  function editMembers() {
    closeSheets();
    const input = prompt('구매자 이름을 쉼표로 구분해 적어 주세요.\n(예: 나, 배우자)', members.map(m => m.name).join(', '));
    if (input === null) return;
    const names = input.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6);
    if (!names.length) return;
    const base = Date.now();
    members = names.map((name, i) => ({ id: members[i] ? members[i].id : `m${base}${i}`, name }));
    saveMembers();
    render();
    showToast(`구매자: ${names.join(', ')}`);
  }

  function updateSubmitLabel() {
    $('submitBtn').innerText = editingId ? '저장'
      : inputRefund ? '↩️ 환불 추가'
      : (inputType === 'fixed' ? '📌 고정 지출에 추가' : '🛒 변동 지출에 추가');
  }

  // 새 항목 추가, 또는 수정 중인 항목 저장
  function addItem() {
    const name = $('nameInput').value.trim();
    const amount = parseInt(onlyDigits($('amtInput').value), 10);
    if (!name) { $('nameInput').focus(); return; }
    if (!amount) { $('amtInput').focus(); return; }
    const date = $('dateInput').value;
    const wasEditing = !!editingId;
    rememberForUndo();

    if (editingId) {
      const found = findItem(editingId);
      if (found) {
        const it = found.it;
        it.type = inputType;
        it.name = name;
        it.amount = amount;
        it.category = selectedCategory;
        if (date.startsWith(found.ym)) it.date = date;
        if (inputCard) {
          // 이미 체크된 항목을 카드로 바꾸면, 그 항목의 달에 카드값을 낸 것으로 본다
          if (!it.card && it.checked) it.paidIn = found.ym;
          it.card = true;
        } else {
          delete it.card;
          delete it.paidIn;
        }
        if (inputRefund) it.refund = true;
        else delete it.refund;
        if (inputWho) it.who = inputWho;
        else delete it.who;
        saveItems();
      }
    } else {
      const it = {
        id: Date.now().toString(),
        type: inputType,
        name,
        amount,
        category: selectedCategory,
        checked: false,
        date: date.startsWith(currentMonth) ? date : $('dateInput').min
      };
      if (inputCard) it.card = true;
      if (inputRefund) it.refund = true;
      if (inputWho) it.who = inputWho;
      items.unshift(it);
      saveItems();
    }
    $('nameInput').value = '';
    $('amtInput').value = '';
    $('repeatHint').innerText = '';
    closeSheets();
    render();
    offerUndo(`'${name}' ${wasEditing ? '수정함' : '추가함'}`);
  }

  // 이번 달 항목에서 먼저 찾고, 없으면 다른 달에서 찾는다 (카드 탭에는 지난달 카드 항목도 나온다)
  function findItem(id) {
    const own = items.find(x => x.id === id);
    if (own) return { it: own, ym: currentMonth };
    for (const [ym, mo] of Object.entries(months)) {
      const it = (mo.items || []).find(x => x.id === id);
      if (it) return { it, ym };
    }
    return null;
  }

  // 카드 항목은 체크할 때 "지금 보고 있는 달에 카드값을 냈다"고 기록한다
  function setChecked(it, on) {
    it.checked = on;
    if (it.card && on) it.paidIn = currentMonth;
    else delete it.paidIn;
  }

  function toggleCheck(id) {
    const found = findItem(id);
    if (!found) return;
    rememberForUndo();
    const it = found.it;
    setChecked(it, !it.checked);
    saveItems();
    render();
    const done = it.refund ? '환불 받음' : it.card ? '결제 완료' : '체크함';
    offerUndo(`'${it.name}' ${it.checked ? done : '체크 해제'}`);
  }

  // 항목 수정: 추가 창을 수정용으로 연다. 삭제도 여기서 한다
  function openEditSheet(id, e) {
    e.stopPropagation();
    const found = findItem(id);
    if (!found) return;
    const it = found.it;
    editingId = id;
    formFromEdit = true;
    setInputType(it.type);
    selectCategory(it.category);
    setPayCard(!!it.card, false);
    setRefund(!!it.refund);
    setWho(it.who || null, false);
    $('nameInput').value = it.name;
    $('amtInput').value = it.amount.toLocaleString('ko-KR');
    const dateEl = $('dateInput');
    dateEl.min = `${found.ym}-01`;
    dateEl.max = `${found.ym}-${String(daysInMonth(found.ym)).padStart(2, '0')}`;
    dateEl.value = /^\d{4}-\d{2}-\d{2}$/.test(it.date || '') ? it.date : dateEl.min;
    $('sheetTitle').innerText = found.ym === currentMonth ? '항목 수정' : `항목 수정 (${parseInt(found.ym.slice(5), 10)}월 항목)`;
    $('deleteBtn').hidden = false;
    openSheet('addSheet');
  }

  function deleteEditing() {
    const found = editingId && findItem(editingId);
    if (!found || !confirm(`'${found.it.name}' 항목을 삭제할까요?`)) return;
    rememberForUndo();
    if (found.ym === currentMonth) {
      items = items.filter(x => x.id !== found.it.id);
    } else {
      const mo = months[found.ym];
      mo.items = mo.items.filter(x => x.id !== found.it.id);
      if (!mo.items.length && !mo.income) delete months[found.ym];
    }
    saveItems();
    closeSheets();  // 입력창 내용과 버튼 글자는 다음에 openAddSheet() 가 되돌린다(formFromEdit)
    render();
    offerUndo(`'${found.it.name}' 삭제함`);
  }

  // 카드 탭: 이번 달 카드 항목 + 지난달까지 쓴 카드 항목 중 이번 달 몫(안 냈거나 이번 달에 낸 것)
  function itemsInTab() {
    if (currentTab === 'card') {
      return items.filter(it => it.card).concat(carriedCardItems(currentMonth).map(c => c.it));
    }
    return currentTab === 'all' ? items : items.filter(it => it.type === currentTab);
  }

  function toggleTabChecks() {
    const target = itemsInTab();
    closeSheets();
    if (!target.length) return;
    rememberForUndo();
    const allChecked = target.every(it => it.checked);
    target.forEach(it => setChecked(it, !allChecked));
    saveItems();
    render();
    offerUndo(`${target.length}개 ${allChecked ? '체크 해제' : '모두 체크'}`);
  }

  function resetAllChecks() {
    closeSheets();
    if (!items.length || !confirm('이번 달 항목의 체크를 모두 해제할까요?')) return;
    rememberForUndo();
    items.forEach(it => setChecked(it, false));
    saveItems();
    render();
    offerUndo('이번 달 체크를 모두 해제함');
  }

  // 지난달 카드 항목은 그 달의 기록이라 지우지 않고, 이번 달 항목만 지운다
  function deleteCheckedInTab() {
    const target = itemsInTab().filter(it => it.checked && items.includes(it));
    closeSheets();
    if (!target.length) {
      showToast('완료된 항목이 없습니다');
      return;
    }
    if (!confirm(`완료된 ${target.length}개 항목을 삭제할까요?`)) return;
    rememberForUndo();
    const ids = new Set(target.map(it => it.id));
    items = items.filter(it => !ids.has(it.id));
    saveItems();
    render();
    offerUndo(`${target.length}개 삭제함`);
  }

  function setTab(tab) {
    currentTab = tab;
    safeSet(TAB_KEY, tab);
    render();
  }
  function setFilter(f) {
    currentFilter = f;
    render();
  }

  // ── 신용카드 계산 ──
  // 카드 항목(card: true)의 체크는 "카드값 결제 완료"이고, 낸 달을 paidIn('YYYY-MM')에 적는다.
  // 돈은 실제로 나간 달 기준으로 센다:
  //   일반 항목 → 체크하면 그 항목의 달에 나간 돈
  //   카드 항목 → 낸 달(paidIn)에 나간 돈. 아직 안 냈으면 지금 보는 달에 낼 돈으로 본다

  // M 이전 달에 쓴 카드 항목 중 아직 안 냈거나 M 에 낸 것 = M 에 낼(낸) 지난 카드값
  function carriedCardItems(M) {
    const out = [];
    Object.keys(months).sort().forEach(ym => {
      if (ym >= M) return;
      (months[ym].items || []).forEach(it => {
        if (it.card && (!it.checked || it.paidIn === M)) out.push({ it, ym });
      });
    });
    return out;
  }

  function monthObj(ym) { return ym === currentMonth ? curMonth : months[ym]; }
  function monthName(ym) { return `${parseInt(ym.slice(5), 10)}월`; }

  // M 달의 돈 계산. 돈이 실제로 나가고 들어온 달 기준이다
  function monthFigures(M) {
    const mo = monthObj(M) || { items: [], incomes: [] };
    const own = mo.items || [];
    const carried = carriedCardItems(M).map(c => c.it);
    // 이 달에 나갈 돈: 이 달 항목(다른 달에 낸 카드 항목은 뺀다) + 지난 카드값 중 이 달 몫
    const outflow = own
      .filter(it => !(it.card && it.checked && it.paidIn && it.paidIn !== M))
      .concat(carried);
    const paidList = outflow.filter(it => it.checked);
    const incs = mo.incomes || [];
    const cardUsed = own.filter(it => it.card);
    return {
      own,
      outflow,
      planned: sumVal(outflow),
      paid: sumVal(paidList),
      paidCount: paidList.length,
      incomeTotal: incs.reduce((s, x) => s + x.amount, 0),
      received: incs.filter(x => x.received).reduce((s, x) => s + x.amount, 0),
      cardUsed: sumVal(cardUsed),
      cardUsedLeft: sumVal(cardUsed.filter(it => !it.checked)),
      cardDue: sumVal(carried),
      cardDueLeft: sumVal(carried.filter(it => !it.checked)),
      hasCard: cardUsed.length > 0 || carried.length > 0
    };
  }

  // ── 이월 ──
  // 지난달 끝에 남은 돈(이월 + 들어온 수입 − 낸 돈)이 이번 달로 넘어온다.
  // 이월을 직접 입력한 달(carry)은 그 값을 쓰고, 지난달에 수입 기록이 없으면(덜 적은 달) 0 으로 본다
  function prevYm(ym) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  function autoCarry(M, depth = 0) {
    const pm = monthObj(prevYm(M));
    if (!pm || depth > 240) return 0;
    if (!(pm.incomes || []).length && typeof pm.carry !== 'number') return 0;
    return endingOf(prevYm(M), depth + 1);
  }
  function carryIn(M, depth = 0) {
    const mo = monthObj(M);
    if (mo && typeof mo.carry === 'number') return mo.carry;
    return autoCarry(M, depth);
  }
  function endingOf(M, depth = 0) {
    const f = monthFigures(M);
    return carryIn(M, depth) + f.received - f.paid;
  }

  function renderSummary() {
    const v = monthFigures(currentMonth);
    const carry = carryIn(currentMonth);
    const remain = carry + v.received - v.paid;
    const final = carry + v.incomeTotal - v.planned;
    const pct = v.planned > 0 ? Math.round(v.paid / v.planned * 100) : 0;

    // 수입·이월
    $('incomeTotal').innerText = won(v.incomeTotal);
    $('incomeSub').innerText = !incomes.length ? '눌러서 입력'
      : (v.received === v.incomeTotal ? `${incomes.length}건 · 모두 들어옴 ✓` : `들어옴 ${won(v.received)}`);
    const manualCarry = typeof curMonth.carry === 'number';
    $('carryRow').hidden = !carry && !manualCarry;
    $('carryLbl').innerText = manualCarry ? '이월 (직접 입력)' : `${monthName(prevYm(currentMonth))}에서 넘어온 돈`;
    $('carryVal').innerText = plusWon(carry);
    $('carryVal').classList.toggle('neg', carry < 0);

    $('remain').innerText = signedWon(remain);
    $('remain').classList.toggle('neg', remain < 0);
    $('spent').innerText = signedWon(v.paid);
    $('final').innerText = signedWon(final);
    $('final').classList.toggle('neg', final < 0);
    $('progressText').innerText = `예정 ${signedWon(v.planned)} 중 ${pct}%`;
    $('countText').innerText = `${v.paidCount} / ${v.outflow.length}건`;
    $('fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
    // 요약을 접었을 때 보이는 한 줄
    $('miniRemain').innerText = signedWon(remain);
    $('miniRemain').classList.toggle('neg', remain < 0);
    $('miniFinal').innerText = signedWon(final);
    $('miniFinal').classList.toggle('neg', final < 0);

    $('tabAll').innerText = signedWon(sumVal(items));
    $('tabFixed').innerText = signedWon(sumVal(items.filter(it => it.type === 'fixed')));
    $('tabVar').innerText = signedWon(sumVal(items.filter(it => it.type === 'variable')));
    $('tabCard').innerText = signedWon(v.cardUsed);

    // 신용카드 요약
    const m = monthName(currentMonth);
    $('cardBox').hidden = !v.hasCard;
    $('cardUsedLbl').innerText = `${m} 사용`;
    $('cardUsed').innerText = signedWon(v.cardUsed);
    $('cardUsedSub').innerText = v.cardUsedLeft ? `미결제 ${signedWon(v.cardUsedLeft)}` : (v.cardUsed ? '모두 결제 완료 ✓' : '사용 없음');
    $('cardUsedSub').classList.toggle('left', v.cardUsedLeft > 0);
    $('cardDueLbl').innerText = `${m}에 낼 지난 카드값`;
    $('cardDue').innerText = signedWon(v.cardDue);
    $('cardDueSub').innerText = v.cardDueLeft ? `남은 ${signedWon(v.cardDueLeft)}` : (v.cardDue ? '모두 결제 완료 ✓' : '없음');
    $('cardDueSub').classList.toggle('left', v.cardDueLeft > 0);
  }

  const WEEKDAYS = '일월화수목금토';

  function render() {
    renderSummary();

    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === currentFilter));
    $('viewBtn').classList.toggle('active', viewMode === 'calendar');
    $('viewBtn').setAttribute('aria-label', viewMode === 'calendar' ? '목록으로 보기' : '달력으로 보기');
    $('searchBtn').classList.toggle('active', !$('searchRow').hidden);

    const box = $('list');
    const carriedYm = new Map(carriedCardItems(currentMonth).map(c => [c.it.id, c.ym]));
    const row = rowRenderer(carriedYm);

    // 검색 중이면 모든 달에서 찾은 결과
    if (searchQuery.trim()) {
      box.innerHTML = searchResultsHtml(row);
      return;
    }

    let list = itemsInTab();
    if (currentFilter === 'checked') list = list.filter(it => it.checked);
    if (currentFilter === 'unchecked') list = list.filter(it => !it.checked);
    // 날짜가 늦은 것을 위로, 같은 날이면 남은 것을 먼저
    list = [...list].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.checked - b.checked));

    if (viewMode === 'calendar') {
      box.innerHTML = calendarHtml(list.filter(it => !carriedYm.has(it.id)), row);
      return;
    }

    if (!list.length && currentTab === 'card') {
      box.innerHTML = `<div class="empty">신용카드 항목이 없습니다.<br>항목을 추가하거나 수정할 때<br>💳 신용카드를 고르면 여기에 모입니다.</div>`;
      return;
    }
    if (!list.length) {
      box.innerHTML = `<div class="empty">항목이 없습니다.<br>아래 버튼으로 추가하세요.${copyButtonHtml()}</div>`;
      return;
    }

    if (currentTab === 'card') {
      const before = list.filter(it => carriedYm.has(it.id));
      const mine = list.filter(it => !carriedYm.has(it.id));
      const m = monthName(currentMonth);
      box.innerHTML =
        (before.length ? `<div class="list-section">지난달까지 쓴 카드값 · ${m}에 낼 돈</div>` + before.map(it => row(it)).join('') : '') +
        (mine.length ? `<div class="list-section">${m} 카드 사용</div>` + mine.map(it => row(it)).join('') : '');
    } else {
      box.innerHTML = groupByDateHtml(list, row);
    }
  }

  // 빈 달이면 이전 달 가져오기 버튼
  function copyButtonHtml() {
    const prev = items.length === 0 ? previousMonthWithData() : null;
    return prev ? `<br><button class="copy-btn" onclick="copyFromPrevious()">📋 ${monthName(prev)}의 수입·고정 지출 가져오기</button>` : '';
  }

  function dayLabel(iso) {
    const d = new Date(`${iso}T00:00:00`);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
  }

  // 날짜별로 묶고, 날짜 줄에 그날 합계를 붙인다 (list 는 날짜순으로 정렬돼 있어야 한다)
  function groupByDateHtml(list, row) {
    let html = '';
    let i = 0;
    while (i < list.length) {
      const date = list[i].date || '';
      const day = [];
      while (i < list.length && (list[i].date || '') === date) day.push(list[i++]);
      const head = /^\d{4}-\d{2}-\d{2}$/.test(date) ? dayLabel(date) : '날짜 없음';
      html += `<div class="day-head"><span>${head}</span><span>${signedWon(sumVal(day))}</span></div>` +
        day.map(it => row(it)).join('');
    }
    return html;
  }

  // 항목 한 줄을 만드는 함수. onclick 을 주면 눌렀을 때 동작이 바뀐다(검색 결과는 그 달로 이동)
  function rowRenderer(carriedYm) {
    const repeats = buildRepeatMap();
    const dateLabel = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? ` · ${parseInt(d.slice(5, 7), 10)}/${parseInt(d.slice(8), 10)}` : '';
    const repeatBadge = it => {
      const r = it.type === 'variable' && !it.refund && repeats[repeatKey(it)];
      return r ? `<button class="repeat" onclick="showRepeat('${it.id}', event)">🔁 ${cycleText(r.avg)}</button>` : '';
    };
    // 카드 항목 표시: 미결제 / 결제 완료 / ○월 결제, 지난달 항목이면 ○월 사용
    const cardBadge = it => {
      if (!it.card) return '';
      const usedYm = carriedYm.get(it.id);
      const homeYm = usedYm || currentMonth;
      const used = usedYm ? `${monthName(usedYm)} 사용 · ` : '';
      const state = !it.checked ? '미결제'
        : (it.paidIn && it.paidIn !== homeYm ? `${monthName(it.paidIn)} 결제` : '결제 완료');
      return `<span class="card-badge ${it.checked ? 'paid' : ''}">💳 ${used}${state}</span>`;
    };
    return (it, onclick = `toggleCheck('${it.id}')`) => `
      <div class="item ${it.checked ? 'checked' : ''}" data-id="${it.id}" onclick="${onclick}">
        <div class="chk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="info">
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="meta">
            <span class="dot ${it.type}"></span>
            <span>${it.type === 'fixed' ? '고정' : '변동'} · ${escapeHtml(it.category || '')}${dateLabel(it.date)}</span>
            ${memberName(it.who) ? `<span class="who-badge">👤 ${escapeHtml(memberName(it.who))}</span>` : ''}
            ${it.refund ? `<span class="refund-badge">↩️ 환불${it.checked ? ' 받음' : ''}</span>` : ''}
            ${cardBadge(it)}
            ${repeatBadge(it)}
          </div>
        </div>
        <div class="amount ${it.refund ? 'refund' : ''}">${it.refund ? '−' : ''}${won(it.amount)}</div>
        <button class="del" onclick="openEditSheet('${it.id}', event)" aria-label="수정">✎</button>
      </div>
    `;
  }

  // ── 검색 ── 모든 달에서 이름·분류로 찾는다. 결과를 누르면 그 달로 간다
  function searchResultsHtml(row) {
    const q = nameKey(searchQuery);
    const found = [];
    Object.keys(months).forEach(ym => (months[ym].items || []).forEach(it => {
      if (nameKey(it.name).includes(q) || nameKey(it.category).includes(q) || nameKey(memberName(it.who)).includes(q)) {
        found.push({ it, ym });
      }
    }));
    if (!found.length) {
      return `<div class="empty">'${escapeHtml(searchQuery.trim())}'이(가) 들어간 항목이 없습니다.</div>`;
    }
    found.sort((a, b) => b.ym.localeCompare(a.ym) || (b.it.date || '').localeCompare(a.it.date || ''));
    let html = `<div class="list-section">모든 달에서 ${found.length}건 · 합계 ${signedWon(sumVal(found.map(f => f.it)))}</div>`;
    let lastYm = null;
    found.forEach(({ it, ym }) => {
      if (ym !== lastYm) {
        const inMonth = found.filter(f => f.ym === ym).map(f => f.it);
        html += `<div class="day-head"><span>${ym.slice(0, 4)}년 ${monthName(ym)}</span><span>${signedWon(sumVal(inMonth))}</span></div>`;
        lastYm = ym;
      }
      html += row(it, `jumpToItem('${it.id}')`);
    });
    return html;
  }

  // ── 달력 ── 날짜 칸에 그날 합계, 남은 항목이 있으면 •, 모두 끝났으면 ✓. 날짜를 누르면 그날 항목
  function calendarHtml(list, row) {
    const [y, m] = currentMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1).getDay();
    const days = daysInMonth(currentMonth);
    const byDay = {};
    list.forEach(it => {
      const d = parseInt((it.date || '').slice(8), 10);
      if (d) (byDay[d] = byDay[d] || []).push(it);
    });
    const today = currentMonth === todayMonth() ? new Date().getDate() : 0;

    let cells = WEEKDAYS.split('').map((w, i) =>
      `<div class="cal-week ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
    for (let i = 0; i < first; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const its = byDay[d] || [];
      const total = sumVal(its);
      const left = its.some(it => !it.checked);
      const wd = (first + d - 1) % 7;
      const mark = !its.length ? '' : left ? '<span class="cal-mark due">•</span>' : '<span class="cal-mark done">✓</span>';
      const cls = ['cal-day', d === selectedDay ? 'sel' : '', d === today ? 'today' : '', wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''].join(' ');
      const title = its.length ? `${m}월 ${d}일 ${its.length}건 ${signedWon(total)}${left ? ' · 남은 항목 있음' : ' · 모두 완료'}` : `${m}월 ${d}일`;
      cells += `<button class="${cls}" onclick="selectDay(${d})" title="${title}">
          <span class="cal-num">${d}${mark}</span>
          <span class="cal-amt">${its.length ? shortWon(total) : ''}</span>
        </button>`;
    }

    let html = `<div class="cal">${cells}</div>`;
    if (selectedDay && selectedDay <= days) {
      const its = byDay[selectedDay] || [];
      const wd = (first + selectedDay - 1) % 7;
      html += `<div class="day-head"><span>${m}월 ${selectedDay}일 (${WEEKDAYS[wd]})</span><span>${its.length ? signedWon(sumVal(its)) : ''}</span></div>`;
      html += its.length ? its.map(it => row(it)).join('')
        : `<div class="empty" style="padding: 18px 10px;">이 날 항목이 없습니다.<br>'＋ 항목 추가'를 누르면 이 날짜로 들어갑니다.</div>`;
    } else {
      html += `<div class="empty" style="padding: 18px 10px;">날짜를 누르면 그날 항목이 보입니다.</div>`;
    }
    const copy = copyButtonHtml();
    if (copy) html += `<div class="empty" style="padding: 0 0 10px;">${copy}</div>`;
    return html;
  }

  // ── 통계 ── 항목 기준(쓴 날짜가 속한 달): 분류별 합계, 지난달 비교, 최근 6개월
  function itemsOf(ym) {
    const mo = monthObj(ym);
    return (mo && mo.items) || [];
  }

  function openStats() {
    renderStats();
    openSheet('statsSheet');
  }

  function renderStats() {
    const M = currentMonth, P = prevYm(M);
    const own = itemsOf(M), prev = itemsOf(P);
    const total = sumVal(own), prevTotal = sumVal(prev);
    const m = monthName(M), pm = monthName(P);
    $('statsTitle').innerText = `📊 ${m} 통계`;

    const byCat = list => list.reduce((acc, it) => {
      const k = it.category || '기타';
      acc[k] = (acc[k] || 0) + val(it);
      return acc;
    }, {});
    const cur = byCat(own), before = byCat(prev);
    const cats = Object.entries(cur).sort((a, b) => b[1] - a[1]);
    const maxCat = Math.max(1, ...cats.map(c => c[1]));
    // 늘었음(▲, 빨강) / 줄었음(▼, 초록): 쓴 돈이라 늘어난 쪽이 나쁜 쪽이다
    const delta = (now, then) => {
      const d = now - then;
      if (!d) return '<span class="delta">– 같음</span>';
      return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${won(Math.abs(d))}</span>`;
    };

    let html = `
      <div class="stat-tile">
        <div class="lbl">${m}에 쓴 돈 (항목 합계)</div>
        <div class="big">${signedWon(total)}</div>
        <div class="sub">${prev.length
          ? `${delta(total, prevTotal)} · ${pm} ${signedWon(prevTotal)}보다 ${total > prevTotal ? '더 씀' : total < prevTotal ? '덜 씀' : '같음'}`
          : `${pm} 기록이 없어 비교할 수 없습니다`}</div>
      </div>
      <div class="split-line">
        <span>고정 <b>${signedWon(sumVal(own.filter(it => it.type === 'fixed')))}</b></span>
        <span>변동 <b>${signedWon(sumVal(own.filter(it => it.type === 'variable')))}</b></span>
      </div>`;

    html += `<div class="stat-h">분류별${prev.length ? `<small>아래 줄은 ${pm}과 비교</small>` : ''}</div>`;
    html += cats.length ? cats.map(([cat, v]) => {
      const share = total > 0 ? v / total * 100 : 0;
      const pct = share > 0 && share < 1 ? '1% 미만' : `${Math.round(share)}%`;
      const w = v > 0 ? Math.max(1, v / maxCat * 100) : 0;
      const pv = before[cat] || 0;
      return `
        <div class="bar-row" title="${escapeHtml(cat)} ${signedWon(v)} (${pct})${prev.length ? ` · ${pm} ${signedWon(pv)}` : ''}">
          <div class="bar-lbl">${escapeHtml(cat)}</div>
          <div class="bar-track">${w ? `<div class="bar" style="width: ${w}%"></div>` : ''}</div>
          <div class="bar-val">${signedWon(v)}<small>${pct}</small></div>
          ${prev.length ? `<div class="bar-sub">${pm} ${signedWon(pv)} · ${delta(v, pv)}</div>` : ''}
        </div>`;
    }).join('') : `<div class="empty" style="padding: 14px;">이 달 항목이 없습니다.</div>`;
    const gone = Object.keys(before).filter(k => !(k in cur));
    if (gone.length && own.length) {
      html += `<div class="bar-sub" style="margin: 4px 2px 0;">${pm}에만 있던 분류: ${gone.map(k => `${escapeHtml(k)} ${signedWon(before[k])}`).join(', ')}</div>`;
    }

    // 사람별: 구매자를 적은 항목이 있을 때만
    if (own.some(it => memberName(it.who))) {
      const byWho = {};
      own.forEach(it => {
        const k = memberName(it.who) ? it.who : '';
        byWho[k] = (byWho[k] || 0) + val(it);
      });
      const rows = Object.entries(byWho).sort((a, b) => b[1] - a[1]);
      const maxWho = Math.max(1, ...rows.map(r => r[1]));
      html += `<div class="stat-h">사람별</div>` + rows.map(([k, v]) => {
        const label = k ? memberName(k) : '안 정함';
        const share = total > 0 ? v / total * 100 : 0;
        const pct = share > 0 && share < 1 ? '1% 미만' : `${Math.round(share)}%`;
        const w = v > 0 ? Math.max(1, v / maxWho * 100) : 0;
        return `
          <div class="bar-row" title="${escapeHtml(label)} ${signedWon(v)} (${pct})">
            <div class="bar-lbl">${escapeHtml(label)}</div>
            <div class="bar-track">${w ? `<div class="bar" style="width: ${w}%"></div>` : ''}</div>
            <div class="bar-val">${signedWon(v)}<small>${pct}</small></div>
          </div>`;
      }).join('');
    }

    // 최근 6개월: 이번 달만 파랑, 나머지는 회색
    const recent = [];
    for (let k = M, i = 0; i < 6; i++, k = prevYm(k)) recent.unshift(k);
    const totals = recent.map(k => ({ ym: k, total: sumVal(itemsOf(k)), has: itemsOf(k).length > 0 }));
    const maxMonth = Math.max(1, ...totals.map(t => t.total));
    html += `<div class="stat-h">최근 6개월<small>${m}만 파란색</small></div>`;
    html += totals.map(t => `
      <div class="bar-row" title="${t.ym.slice(0, 4)}년 ${monthName(t.ym)} ${t.has ? signedWon(t.total) : '기록 없음'}">
        <div class="bar-lbl">${t.ym.slice(2, 4)}년 ${monthName(t.ym)}</div>
        <div class="bar-track">${t.has && t.total > 0
          ? `<div class="bar ${t.ym === M ? '' : 'muted'}" style="width: ${Math.max(1, t.total / maxMonth * 100)}%"></div>` : ''}</div>
        <div class="bar-val">${t.has ? signedWon(t.total) : '<small>기록 없음</small>'}</div>
      </div>`).join('');

    $('statsBody').innerHTML = html;
  }

  // ── 수입 ──
  // 수입을 여러 건 적고, 실제로 들어왔는지 체크한다. 이월 금액도 여기서 직접 고칠 수 있다
  function openIncomeSheet() {
    editingIncomeId = null;
    $('incName').value = '';
    $('incAmt').value = '';
    renderIncomeSheet();
    openSheet('incomeSheet');
  }

  function renderIncomeSheet() {
    const m = monthName(currentMonth);
    $('incomeTitle').innerText = `${m} 수입`;
    $('incomeList').innerHTML = incomes.length ? incomes.map(x => `
      <div class="item ${x.received ? 'checked' : ''}" onclick="toggleIncome('${x.id}')">
        <div class="chk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="info">
          <div class="name">${escapeHtml(x.name)}</div>
          <div class="meta">${x.received ? '들어옴' : '들어올 예정 · 들어오면 체크'}</div>
        </div>
        <div class="amount income-amt">${won(x.amount)}</div>
        <button class="del" onclick="editIncome('${x.id}', event)" aria-label="수정">✎</button>
      </div>`).join('')
      : `<div class="empty" style="padding: 16px 10px;">아직 수입이 없습니다. 아래에서 추가하세요.</div>`;

    const editing = editingIncomeId && incomes.find(x => x.id === editingIncomeId);
    $('incSubmit').innerText = editing ? '저장' : '＋ 수입 추가';
    $('incDelete').hidden = !editing;

    // 이월: 자동으로 계산한 값과 직접 입력한 값
    const auto = autoCarry(currentMonth);
    const manual = typeof curMonth.carry === 'number';
    $('carryHelp').innerText = manual
      ? `직접 입력한 금액을 쓰는 중입니다. (자동으로 계산하면 ${plusWon(auto)})`
      : `자동: ${monthName(prevYm(currentMonth))}에 남은 돈 ${plusWon(auto)}` +
        (auto ? '' : `\n${monthName(prevYm(currentMonth))}에 수입 기록이 없으면 0으로 봅니다.`);
    $('carryInput').value = manual ? Math.max(0, curMonth.carry).toLocaleString('ko-KR') : '';
    $('carryAutoBtn').hidden = !manual;
  }

  function toggleIncome(id) {
    const x = incomes.find(i => i.id === id);
    if (!x) return;
    rememberForUndo();
    x.received = !x.received;
    saveItems();
    renderIncomeSheet();
    render();
    offerUndo(`'${x.name}' ${x.received ? '들어옴' : '체크 해제'}`);
  }

  function editIncome(id, e) {
    e.stopPropagation();
    const x = incomes.find(i => i.id === id);
    if (!x) return;
    editingIncomeId = id;
    $('incName').value = x.name;
    $('incAmt').value = x.amount.toLocaleString('ko-KR');
    renderIncomeSheet();
    $('incName').focus();
  }

  function saveIncome() {
    const name = $('incName').value.trim() || '수입';
    const amount = parseInt(onlyDigits($('incAmt').value), 10);
    if (!amount) { $('incAmt').focus(); return; }
    rememberForUndo();
    const editing = editingIncomeId && incomes.find(x => x.id === editingIncomeId);
    if (editing) {
      editing.name = name;
      editing.amount = amount;
    } else {
      incomes.push({ id: `inc-${Date.now()}`, name, amount, received: false });
    }
    editingIncomeId = null;
    $('incName').value = '';
    $('incAmt').value = '';
    saveItems();
    renderIncomeSheet();
    render();
    offerUndo(`'${name}' ${editing ? '수정함' : '추가함'}`);
  }

  function deleteIncome() {
    const x = editingIncomeId && incomes.find(i => i.id === editingIncomeId);
    if (!x || !confirm(`'${x.name}' 수입을 삭제할까요?`)) return;
    rememberForUndo();
    incomes = incomes.filter(i => i.id !== x.id);
    editingIncomeId = null;
    $('incName').value = '';
    $('incAmt').value = '';
    saveItems();
    renderIncomeSheet();
    render();
    offerUndo(`'${x.name}' 삭제함`);
  }

  // 이월 칸: 숫자를 쓰면 그 금액을 쓰고, 비우면 자동 계산으로 돌아간다
  function saveCarryInput() {
    const raw = onlyDigits($('carryInput').value);
    rememberForUndo();
    if (raw) curMonth.carry = parseInt(raw, 10);
    else delete curMonth.carry;
    saveItems();
    renderIncomeSheet();
    render();
  }
  function clearCarry() {
    $('carryInput').value = '';
    saveCarryInput();
  }

  // ── 요약 접기 ──
  function applySummaryCollapsed(collapsed) {
    $('summary').classList.toggle('collapsed', collapsed);
  }
  function toggleSummary() {
    const collapsed = !$('summary').classList.contains('collapsed');
    applySummaryCollapsed(collapsed);
    safeSet(SUMMARY_KEY, collapsed ? '1' : '');
  }

  // ── 보기 전환·검색 ──
  function toggleView() {
    viewMode = viewMode === 'calendar' ? 'list' : 'calendar';
    safeSet(VIEW_KEY, viewMode);
    render();
  }
  function selectDay(d) {
    selectedDay = selectedDay === d ? null : d;
    render();
  }
  function toggleSearch() {
    const row = $('searchRow');
    if (row.hidden) {
      row.hidden = false;
      render();
      $('searchInput').focus();
    } else {
      closeSearch();
    }
  }
  function closeSearch() {
    $('searchRow').hidden = true;
    $('searchInput').value = '';
    searchQuery = '';
    render();
  }
  // 검색 결과를 누르면 그 항목이 있는 달로 가서 보여준다
  function jumpToItem(id) {
    let ym = null;
    for (const [k, mo] of Object.entries(months)) {
      if ((mo.items || []).some(it => it.id === id)) { ym = k; break; }
    }
    if (!ym) return;
    const it = months[ym].items.find(x => x.id === id);
    $('searchRow').hidden = true;
    $('searchInput').value = '';
    searchQuery = '';
    currentFilter = 'all';
    if (currentTab !== 'all' && !(currentTab === it.type) && !(currentTab === 'card' && it.card)) currentTab = 'all';
    selectMonth(ym);
    if (viewMode === 'calendar') {
      selectedDay = parseInt((it.date || '').slice(8), 10) || null;
      render();
    }
    const el = document.querySelector(`#list [data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1600);
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }

  // ── 뒤로 가기 막기 ──
  // 다른 앱(내 파일 등)에서 연 탭은 뒤로 갈 기록이 없으면 Chrome이 뒤로 가기에 탭을 닫아 버린다.
  // 기록을 쌓아 두면 뒤로 가기가 이 페이지 안에서 처리된다(popstate).
  //   기록: [처음 연 페이지] ← [guard] ← [sheet: 입력창·메뉴가 열려 있을 때만]
  // Chrome 규칙(history manipulation intervention):
  //   - 사용자 터치 없이 쌓은 기록은 뒤로 가기에서 건너뛴다 → 터치(click)할 때 쌓는다
  //   - 뒤로 가기 직후 새 터치 없이 쌓은 기록도 건너뛴다 → 뒤로 가기를 처리하면서 다시 쌓지 않는다
  let poppingSheet = false;  // closeSheets() 가 직접 history.back() 한 경우
  let toastTimer = null;

  function isState(name) {
    return !!(history.state && history.state.budget === name);
  }

  function armBackGuard() {
    if (history.state && history.state.budget) return;  // 이미 guard 나 sheet 위에 있다
    history.pushState({ budget: 'guard' }, '');
  }

  // 아래쪽 안내. action 을 주면 버튼(되돌리기 등)이 붙고 조금 더 오래 보인다
  function showToast(msg, action) {
    const t = $('toast');
    t.innerHTML = '';
    const text = document.createElement('span');
    text.textContent = msg;
    t.appendChild(text);
    if (action) {
      const b = document.createElement('button');
      b.className = 'toast-btn';
      b.textContent = action.label;
      b.onclick = e => {
        e.stopPropagation();
        hideToast();
        action.run();
      };
      t.appendChild(b);
    }
    t.classList.toggle('actionable', !!action);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 5000 : 2000);
  }
  function hideToast() {
    $('toast').classList.remove('show', 'actionable');
  }

  // ── 되돌리기 ──
  // 바꾸기 직전의 전체 데이터를 한 벌 저장해 두었다가, 안내의 '되돌리기'를 누르면 그대로 되돌린다
  let undoSnapshot = null;
  function rememberForUndo() {
    undoSnapshot = JSON.stringify(months);
  }
  function offerUndo(msg) {
    showToast(msg, { label: '되돌리기', run: undoLast });
  }
  function undoLast() {
    if (!undoSnapshot) return;
    months = JSON.parse(undoSnapshot);
    undoSnapshot = null;
    safeSet(MONTHS_KEY, JSON.stringify(months));
    selectMonth(currentMonth);  // 보고 있는 달 데이터를 다시 읽는다
    if ($('incomeSheet').classList.contains('open')) renderIncomeSheet();
    showToast('되돌렸습니다');
  }

  // click 은 터치가 끝난 뒤(사용자 활성화가 생긴 뒤)에 오므로, 여기서 쌓은 기록은 건너뛰어지지 않는다
  ['click', 'keydown'].forEach(type => document.addEventListener(type, e => {
    if (e.isTrusted) armBackGuard();
  }, true));

  window.addEventListener('popstate', () => {
    if (poppingSheet) {           // closeSheets() 가 되돌린 것
      poppingSheet = false;
      return;
    }
    if (isState('guard')) {       // 창이 열린 채 뒤로 가기 → 창만 닫는다
      hideSheets();
      return;
    }
    if (isState('sheet')) {       // 앞으로 가기로 창 기록에 들어온 경우 → 되돌린다
      poppingSheet = true;
      history.back();
      return;
    }
    // 처음 연 페이지까지 돌아왔다. 더 뒤로 갈 기록이 없으니 한 번 더 누르면 닫힌다.
    // 화면을 다시 누르면 armBackGuard() 가 기록을 새로 쌓는다
    hideSheets();
    showToast('뒤로 가기를 한 번 더 누르면 닫힙니다');
  });

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
