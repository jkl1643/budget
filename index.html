<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="체크가계부">
  <title>체크 가계부</title>
  <style>
    :root {
      --bg: #0a0f1d;
      --surface: #141d2f;
      --card: #1b263b;
      --input: #0e1626;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --sub: #94a3b8;
      --muted: #64748b;
      --green: #10b981;
      --red: #f43f5e;
      --sky: #38bdf8;
      --indigo: #818cf8;
      --amber: #f59e0b;
      --sheet-bg: rgba(0, 0, 0, 0.55);
      /* 통계 그래프: 강조 막대(파랑)와 덜 중요한 막대(회색), 늘었음/줄었음 표시 */
      --viz-accent: #3987e5;
      --viz-muted: #5c5c5c;
      --viz-bad: #d03b3b;
      --viz-good: #0ca30c;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --card: #ffffff;
      --input: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --sub: #475569;
      --muted: #94a3b8;
      --green: #059669;
      --red: #e11d48;
      --sky: #0284c7;
      --indigo: #4f46e5;
      --amber: #b45309;
      --sheet-bg: rgba(15, 23, 42, 0.35);
      --viz-accent: #2a78d6;
      --viz-muted: #a8a29e;
      --viz-bad: #d03b3b;
      --viz-good: #006300;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { background: var(--bg); color: var(--text); }
    body { display: flex; justify-content: center; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:active { transform: scale(0.97); }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 14px calc(96px + env(safe-area-inset-bottom));
    }

    /* 요약 카드 */
    .summary {
      margin-top: 12px;
      background: linear-gradient(145deg, rgba(99, 102, 241, 0.16), rgba(16, 185, 129, 0.10)), var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 18px 16px;
    }
    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -4px -6px 14px;
    }
    .month-arrow {
      background: none;
      border: none;
      width: 44px;
      height: 44px;
      font-size: 26px;
      font-weight: 700;
      color: var(--sub);
    }
    .month-label {
      position: relative;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-align: center;
    }
    .month-label small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--sky);
      letter-spacing: 0;
    }
    /* 투명한 month 입력을 라벨 위에 덮어서, 라벨을 누르면 기기 기본 년월 선택기가 뜨게 한다 */
    .month-label input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .copy-btn {
      margin-top: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: var(--indigo);
    }

    .income-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--sub);
    }
    .income-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--input);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
    }
    .income-box:focus-within { border-color: var(--green); }
    .income-box input {
      width: 140px;
      background: transparent;
      border: none;
      outline: none;
      text-align: right;
      color: var(--green);
      font-size: 18px;
      font-weight: 800;
    }
    .income-box span { font-size: 15px; font-weight: 700; color: var(--sub); }

    .remain-label { margin-top: 18px; font-size: 14px; font-weight: 700; color: var(--sub); }
    .remain {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--green);
      line-height: 1.15;
    }
    .remain.neg { color: var(--red); }

    .mini-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .mini {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .mini-lbl { font-size: 13px; font-weight: 600; color: var(--sub); }
    .mini-val { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; margin-top: 2px; }
    .mini-val.spent { color: var(--text); }
    .mini-val.final { color: var(--sky); }
    .mini-val.neg { color: var(--red); }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
    }
    .track { height: 8px; background: var(--input); border-radius: 99px; overflow: hidden; }
    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      border-radius: 99px;
      transition: width 0.25s;
    }

    /* 탭 */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin: 14px -14px 0;
      padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
      background: var(--bg);
    }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 4px;
      text-align: center;
      color: var(--sub);
    }
    .tab b { display: block; font-size: 15px; font-weight: 800; }
    .tab small { display: block; font-size: 12px; font-weight: 600; margin-top: 1px; }
    .tab.active { color: var(--text); border-color: var(--sky); background: rgba(56, 189, 248, 0.14); }
    .tab.active[data-tab="fixed"] { border-color: var(--indigo); background: rgba(129, 140, 248, 0.16); }
    .tab.active[data-tab="card"] { border-color: var(--amber); background: rgba(245, 158, 11, 0.14); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin: 4px 0 10px;
    }
    .filters { display: flex; gap: 4px; }
    .chip {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
    }
    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .more-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 38px;
      height: 34px;
      font-size: 18px;
      color: var(--sub);
    }

    /* 항목 */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 8px 13px 14px;
      cursor: pointer;
    }
    .item.checked { opacity: 0.6; border-color: rgba(16, 185, 129, 0.35); }
    .chk {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chk svg { display: none; width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .item.checked .chk { background: var(--green); border-color: var(--green); }
    .item.checked .chk svg { display: block; }
    .info { flex: 1; min-width: 0; }
    .name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item.checked .name { text-decoration: line-through; color: var(--muted); }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .dot { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
    .dot.fixed { background: var(--indigo); }
    .dot.variable { background: var(--sky); }
    .amount { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
    .item.checked .amount { color: var(--green); }
    .del {
      background: none;
      border: none;
      width: 34px;
      height: 34px;
      font-size: 22px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .empty { text-align: center; padding: 40px 10px; font-size: 15px; color: var(--muted); }

    /* 추가 버튼 */
    .fab {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 492px;
      height: 56px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      z-index: 10;
    }
    .fab:active { transform: translateX(-50%) scale(0.98); }

    /* 바텀시트 공통 */
    .backdrop {
      position: fixed;
      inset: 0;
      background: var(--sheet-bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 520px;
      transform: translate(-50%, 105%);
      transition: transform 0.25s ease-out;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
      z-index: 21;
      max-height: 92dvh;
      overflow-y: auto;
    }
    .sheet.open { transform: translate(-50%, 0); }
    .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--border); margin: 0 auto 14px; }
    .sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; }

    .type-seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--input);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
    }
    .type-seg button {
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 10px;
      font-size: 15px;
      font-weight: 800;
      color: var(--sub);
    }
    .type-seg button.active.variable { background: rgba(56, 189, 248, 0.2); color: var(--sky); }
    .type-seg button.active.fixed { background: rgba(129, 140, 248, 0.22); color: var(--indigo); }

    .field {
      width: 100%;
      background: var(--input);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      color: var(--text);
      outline: none;
      margin-bottom: 8px;
    }
    .field:focus { border-color: var(--sky); }
    .field.amt { font-weight: 800; text-align: right; }
    .field.date { font-size: 16px; color: var(--sub); min-height: 52px; }
    .recent-wrap { margin-bottom: 10px; }
    .recent-wrap.hidden { display: none; }
    .recent-lbl { font-size: 13px; font-weight: 700; color: var(--sub); margin: 0 2px 6px; }
    .recent-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -16px;
      padding: 0 16px 2px;
    }
    .recent-row::-webkit-scrollbar { display: none; }
    .recent-chip {
      flex-shrink: 0;
      max-width: 180px;
      text-align: left;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .recent-chip b {
      display: block;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-chip small { font-size: 12px; font-weight: 600; color: var(--muted); }
    .repeat-hint { font-size: 14px; font-weight: 700; color: var(--indigo); margin: -2px 2px 10px; }
    .repeat-hint:empty { display: none; }

    .repeat {
      background: rgba(129, 140, 248, 0.16);
      color: var(--indigo);
      border: none;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .s-chip {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
    }
    .s-chip.active { border-color: var(--sky); color: var(--sky); background: rgba(56, 189, 248, 0.15); }
    .s-chip.danger { color: var(--red); }

    .submit {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }

    .menu-btn {
      width: 100%;
      text-align: left;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .menu-btn.danger { color: var(--red); }

    /* 요약 접기 */
    .summary.collapsed .sum-body,
    .summary.collapsed .sum-toggle { display: none; }
    .summary:not(.collapsed) .sum-mini { display: none; }
    .sum-mini {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
    }
    .sum-mini span { white-space: nowrap; }
    .sum-mini span:first-child { flex: 1; text-align: left; }
    .sum-mini b { font-size: 17px; color: var(--green); margin-left: 4px; }
    .sum-mini span:nth-child(2) b { font-size: 15px; color: var(--sky); }
    .sum-mini b.neg { color: var(--red); }
    .sum-mini-arrow { font-size: 18px; color: var(--muted); }
    .sum-toggle {
      display: block;
      margin: 10px auto -8px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
    }

    /* 수입·이월 (요약 안의 버튼) */
    button.income-row { width: 100%; background: none; border: none; padding: 0; text-align: left; }
    .income-val {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--input);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
    }
    .income-val b { font-size: 18px; font-weight: 800; color: var(--green); }
    .income-val small { font-size: 12px; font-weight: 700; color: var(--muted); }
    .carry-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      background: none;
      border: none;
      padding: 0 2px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
    }
    .carry-row[hidden] { display: none; }
    .carry-row b { color: var(--green); }
    .carry-row b.neg { color: var(--red); }
    .income-amt { color: var(--green); }
    .item.checked .income-amt { color: var(--green); }
    .inc-form { margin-top: 12px; }
    .sheet-sub { font-size: 15px; font-weight: 800; margin: 18px 2px 4px; }
    .carry-help { font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 2px 8px; white-space: pre-line; }

    /* 도구 버튼·검색 */
    .tool-btns { display: flex; gap: 6px; }
    .more-btn.active { border-color: var(--sky); background: rgba(56, 189, 248, 0.16); }
    .search-row { display: flex; gap: 6px; margin: -2px 0 10px; }
    .search-row[hidden] { display: none; }
    .search-row .field { margin: 0; padding: 10px 12px; font-size: 16px; }
    .search-row .more-btn { height: auto; width: 44px; }

    /* 환불 */
    .s-chip.refund-chip.active { border-color: var(--green); color: var(--green); background: rgba(16, 185, 129, 0.15); }
    /* 누가 샀는지 */
    .who-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .who-lbl { font-size: 14px; font-weight: 800; color: var(--sub); flex-shrink: 0; }
    .who-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .who-badge {
      background: rgba(129, 140, 248, 0.16);
      color: var(--indigo);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 800;
    }
    .refund-badge {
      background: rgba(16, 185, 129, 0.14);
      color: var(--green);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 800;
    }
    .amount.refund { color: var(--green); }

    /* 날짜별 묶음 */
    .day-head {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: var(--sub);
      margin: 8px 4px 0;
    }
    .day-head span:last-child { color: var(--text); }
    .item.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--sky); } 100% { box-shadow: 0 0 0 0 transparent; } }

    /* 달력 */
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 6px;
    }
    .cal-week { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); padding: 2px 0 4px; }
    .cal-week.sun, .cal-day.sun .cal-num { color: var(--red); }
    .cal-week.sat, .cal-day.sat .cal-num { color: var(--sky); }
    .cal-day {
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      background: none;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 4px 0;
    }
    .cal-day.today { border-color: var(--border); background: var(--input); }
    .cal-day.sel { border-color: var(--sky); background: rgba(56, 189, 248, 0.14); }
    .cal-num { font-size: 14px; font-weight: 800; color: var(--text); }
    .cal-mark { font-size: 12px; margin-left: 1px; }
    .cal-mark.due { color: var(--amber); }
    .cal-mark.done { color: var(--green); }
    .cal-amt { font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: -0.3px; }

    /* 통계 */
    .stat-tile {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .stat-tile .lbl { font-size: 13px; font-weight: 700; color: var(--sub); }
    .stat-tile .big { font-size: 28px; font-weight: 900; letter-spacing: -0.8px; margin: 2px 0; }
    .stat-tile .sub { font-size: 13px; font-weight: 600; color: var(--sub); }
    .delta { font-weight: 800; }
    .delta.up { color: var(--viz-bad); }
    .delta.down { color: var(--viz-good); }
    .stat-h { font-size: 15px; font-weight: 800; margin: 18px 2px 8px; }
    .stat-h small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .bar-row {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 4px 8px;
      padding: 6px 2px;
    }
    .bar-lbl { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 12px; }
    .bar {
      height: 12px;
      min-width: 2px;
      background: var(--viz-accent);
      border-radius: 0 4px 4px 0;  /* 바닥(왼쪽)은 각지게, 끝은 둥글게 */
    }
    .bar.muted { background: var(--viz-muted); }
    .bar-val { font-size: 13px; font-weight: 800; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .bar-val small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
    .bar-sub { grid-column: 2 / 4; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: -2px; }
    .split-line { display: flex; gap: 12px; font-size: 13px; font-weight: 700; color: var(--sub); margin: 8px 2px 0; }
    .split-line b { color: var(--text); }

    /* 아래 안내(되돌리기 버튼이 붙을 수 있음) */
    .toast { max-width: calc(100vw - 32px); }
    .toast.actionable { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
    .toast span { overflow: hidden; text-overflow: ellipsis; }
    .toast-btn { background: none; border: none; color: #38bdf8; font-size: 15px; font-weight: 800; padding: 2px 0; flex-shrink: 0; }

    /* 신용카드 */
    .card-box { margin-top: 12px; cursor: pointer; }
    .card-box-title { font-size: 14px; font-weight: 800; color: var(--amber); margin: 0 2px 6px; }
    .mini-sub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    .mini-sub.left { color: var(--amber); }
    .card-badge {
      background: rgba(245, 158, 11, 0.16);
      color: var(--amber);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 800;
    }
    .card-badge.paid { background: rgba(16, 185, 129, 0.14); color: var(--green); }
    .list-section { font-size: 14px; font-weight: 800; color: var(--sub); margin: 6px 2px 0; }
    .pay-seg button.active.cash { background: rgba(16, 185, 129, 0.18); color: var(--green); }
    .pay-seg button.active.credit { background: rgba(245, 158, 11, 0.2); color: var(--amber); }
    .delete-btn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 14px;
      background: transparent;
      color: var(--red);
      font-size: 15px;
      font-weight: 800;
    }
    .delete-btn[hidden] { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 99px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 30;
    }
    .toast.show { opacity: 1; }

    .storage-warn {
      margin-top: 12px;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: var(--red);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }
    .storage-warn[hidden] { display: none; }
    .storage-info {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="storage-warn" id="storageWarn" hidden>
    ⚠️ 지금 연 방식으로는 브라우저에 저장이 되지 않습니다. 닫으면 입력한 내용이 사라지니 ⋯ → 백업 내보내기를 해 두세요.
  </div>
  <!-- 요약 -->
  <section class="summary" id="summary">
    <div class="month-nav">
      <button class="month-arrow" onclick="shiftMonth(-1)" aria-label="이전 달">‹</button>
      <label class="month-label">
        <span id="monthText">2026년 10월</span>
        <small id="monthSub"></small>
        <input type="month" id="monthPicker">
      </label>
      <button class="month-arrow" onclick="shiftMonth(1)" aria-label="다음 달">›</button>
    </div>

    <!-- 요약을 접었을 때 보이는 한 줄 (누르면 펼침) -->
    <button class="sum-mini" onclick="toggleSummary()">
      <span>남은 돈 <b id="miniRemain">₩0</b></span>
      <span>다 내면 <b id="miniFinal">₩0</b></span>
      <span class="sum-mini-arrow">⌄</span>
    </button>

    <div class="sum-body">
    <button class="income-row" onclick="openIncomeSheet()">
      <span>수입</span>
      <span class="income-val"><b id="incomeTotal">₩0</b><small id="incomeSub">눌러서 입력</small></span>
    </button>
    <button class="carry-row" id="carryRow" onclick="openIncomeSheet()" hidden>
      <span id="carryLbl">지난달에서 넘어온 돈</span>
      <b id="carryVal">₩0</b>
    </button>

    <div class="remain-label">현재 남은 돈</div>
    <div class="remain" id="remain">₩0</div>

    <div class="mini-stats">
      <div class="mini">
        <div class="mini-lbl">낸 돈 (체크)</div>
        <div class="mini-val spent" id="spent">₩0</div>
      </div>
      <div class="mini">
        <div class="mini-lbl">다 내면 남는 돈</div>
        <div class="mini-val final" id="final">₩0</div>
      </div>
    </div>

    <!-- 신용카드: 카드 항목이 있을 때만 보인다. 누르면 카드 탭으로 -->
    <div class="card-box" id="cardBox" hidden onclick="setTab('card')">
      <div class="card-box-title">💳 신용카드</div>
      <div class="mini-stats" style="margin-top: 0;">
        <div class="mini">
          <div class="mini-lbl" id="cardUsedLbl">이번 달 사용</div>
          <div class="mini-val" id="cardUsed">₩0</div>
          <div class="mini-sub" id="cardUsedSub"></div>
        </div>
        <div class="mini">
          <div class="mini-lbl" id="cardDueLbl">이번 달에 낼 카드값</div>
          <div class="mini-val" id="cardDue">₩0</div>
          <div class="mini-sub" id="cardDueSub"></div>
        </div>
      </div>
    </div>

    <div class="progress-info">
      <span id="progressText">예정 ₩0 중 0%</span>
      <span id="countText">0 / 0건</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="sum-toggle" onclick="toggleSummary()">⌃ 요약 접기</button>
  </section>

  <!-- 고정 / 변동 / 전체 탭 -->
  <nav class="tabs">
    <button class="tab" data-tab="all" onclick="setTab('all')"><b>전체</b><small id="tabAll">₩0</small></button>
    <button class="tab" data-tab="fixed" onclick="setTab('fixed')"><b>고정</b><small id="tabFixed">₩0</small></button>
    <button class="tab" data-tab="variable" onclick="setTab('variable')"><b>변동</b><small id="tabVar">₩0</small></button>
    <button class="tab" data-tab="card" onclick="setTab('card')"><b>💳 카드</b><small id="tabCard">₩0</small></button>
  </nav>

  <div class="toolbar">
    <div class="filters">
      <button class="chip" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="chip" data-filter="unchecked" onclick="setFilter('unchecked')">남은 것</button>
      <button class="chip" data-filter="checked" onclick="setFilter('checked')">완료</button>
    </div>
    <div class="tool-btns">
      <button class="more-btn" id="searchBtn" onclick="toggleSearch()" aria-label="검색">🔍</button>
      <button class="more-btn" id="viewBtn" onclick="toggleView()" aria-label="달력으로 보기">📅</button>
      <button class="more-btn" onclick="openStats()" aria-label="통계">📊</button>
      <button class="more-btn" onclick="openSheet('menuSheet')" aria-label="더보기">⋯</button>
    </div>
  </div>
  <div class="search-row" id="searchRow" hidden>
    <input type="text" id="searchInput" class="field" placeholder="항목 이름·분류로 찾기 (모든 달)" autocomplete="off" enterkeyhint="search">
    <button class="more-btn" onclick="closeSearch()" aria-label="검색 닫기">✕</button>
  </div>

  <main class="list" id="list"></main>
</div>

<button class="fab" onclick="openAddSheet()">＋ 항목 추가</button>
<div class="toast" id="toast"></div>

<div class="backdrop" id="backdrop" onclick="closeSheets()"></div>

<!-- 추가 시트 -->
<section class="sheet" id="addSheet">
  <div class="grip"></div>
  <div class="sheet-title" id="sheetTitle">새 항목</div>
  <div class="type-seg">
    <button class="variable" id="typeVar" onclick="setInputType('variable')">🛒 변동 지출</button>
    <button class="fixed" id="typeFixed" onclick="setInputType('fixed')">📌 고정 지출</button>
  </div>
  <div class="type-seg pay-seg">
    <button class="cash" id="payCash" onclick="setPayCard(false)">💵 현금·체크카드</button>
    <button class="credit" id="payCard" onclick="setPayCard(true)">💳 신용카드</button>
  </div>
  <div class="who-row">
    <span class="who-lbl">누가</span>
    <div class="who-chips" id="whoChips"></div>
  </div>
  <div class="recent-wrap" id="recentWrap">
    <div class="recent-lbl">최근 항목</div>
    <div class="recent-row" id="recentChips"></div>
  </div>
  <input type="text" id="nameInput" class="field" placeholder="항목명" autocomplete="off" enterkeyhint="next">
  <input type="tel" inputmode="numeric" id="amtInput" class="field amt" placeholder="금액 (원)" enterkeyhint="done">
  <input type="date" id="dateInput" class="field date">
  <div class="repeat-hint" id="repeatHint"></div>
  <div class="chips-row">
    <button class="s-chip" onclick="addAmount(1000)">+1천</button>
    <button class="s-chip" onclick="addAmount(5000)">+5천</button>
    <button class="s-chip" onclick="addAmount(10000)">+1만</button>
    <button class="s-chip" onclick="addAmount(50000)">+5만</button>
    <button class="s-chip" onclick="addAmount(100000)">+10만</button>
    <button class="s-chip danger" onclick="clearAmount()">지우기</button>
    <button class="s-chip refund-chip" id="refundBtn" onclick="setRefund(!inputRefund)">↩️ 환불</button>
  </div>
  <div class="chips-row" id="catChips"></div>
  <button class="submit" id="submitBtn" onclick="addItem()">추가하기</button>
  <button class="delete-btn" id="deleteBtn" onclick="deleteEditing()" hidden>🗑️ 이 항목 삭제</button>
</section>

<!-- 더보기 메뉴 시트 -->
<section class="sheet" id="menuSheet">
  <div class="grip"></div>
  <div class="sheet-title">더보기</div>
  <div class="storage-info" id="storageInfo" style="margin: -6px 2px 12px;"></div>
  <button class="menu-btn" onclick="toggleTabChecks()">✅ 현재 탭 전체 체크 / 해제</button>
  <button class="menu-btn" onclick="resetAllChecks()">🔄 모든 체크 초기화</button>
  <button class="menu-btn" onclick="menuCopyFromPrevious()">📋 이전 달 수입·고정 지출 가져오기</button>
  <button class="menu-btn" onclick="editMembers()">👤 구매자 이름 바꾸기</button>
  <button class="menu-btn" onclick="exportBackup()">💾 백업 내보내기 (모든 달)</button>
  <button class="menu-btn" onclick="$('importFile').click()">📂 백업 불러오기</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button class="menu-btn danger" onclick="deleteCheckedInTab()">🗑️ 현재 탭의 완료 항목 삭제</button>
</section>

<!-- 수입·이월 시트 -->
<section class="sheet" id="incomeSheet">
  <div class="grip"></div>
  <div class="sheet-title" id="incomeTitle">수입</div>
  <div class="list" id="incomeList"></div>
  <div class="inc-form">
    <input type="text" id="incName" class="field" placeholder="수입 이름 (예: 육아급여)" autocomplete="off" enterkeyhint="next">
    <input type="tel" inputmode="numeric" id="incAmt" class="field amt" placeholder="금액 (원)" enterkeyhint="done">
    <button class="submit" id="incSubmit" onclick="saveIncome()">＋ 수입 추가</button>
    <button class="delete-btn" id="incDelete" onclick="deleteIncome()" hidden>🗑️ 이 수입 삭제</button>
  </div>
  <div class="sheet-sub">지난달에서 넘어온 돈 (이월)</div>
  <div class="carry-help" id="carryHelp"></div>
  <input type="tel" inputmode="numeric" id="carryInput" class="field amt" placeholder="직접 입력하려면 금액을 쓰세요">
  <button class="s-chip" id="carryAutoBtn" onclick="clearCarry()" hidden>자동 계산으로 되돌리기</button>
</section>

<!-- 통계 시트 -->
<section class="sheet" id="statsSheet">
  <div class="grip"></div>
  <div class="sheet-title" id="statsTitle">통계</div>
  <div id="statsBody"></div>
</section>

<script>
  // 년월별 데이터: { 'YYYY-MM': { income, items } }
  const MONTHS_KEY = 'split_mobile_budget_months_v3';
  // 기존 파일(mobile_budget.html)의 키. 처음 한 번만 읽어서 이번 달로 옮기고, 원본은 지우지 않는다
  const OLD_STORAGE_KEY = 'split_mobile_budget_data_v2';
  const OLD_INCOME_KEY = 'split_mobile_budget_income_v2';
  const THEME_KEY = 'standalone_mobile_budget_theme_v1';
  const TAB_KEY = 'split_mobile_budget_tab_v2';
  const EXCEL_KEY = 'split_mobile_budget_excel_v1';
  const PAY_KEY = 'split_mobile_budget_paymethod_v1';  // 새 항목의 결제수단 기본값(마지막에 고른 것)
  const VIEW_KEY = 'split_mobile_budget_view_v1';      // 목록 / 달력
  const SUMMARY_KEY = 'split_mobile_budget_sumfold_v1'; // 요약을 접어 두었는지
  const MEMBERS_KEY = 'split_mobile_budget_members_v1'; // 구매자 목록 [{ id, name }]
  const WHO_KEY = 'split_mobile_budget_who_v1';         // 새 항목의 구매자 기본값(마지막에 고른 사람)

  // 분류는 가계부.xlsx 의 대분류/카테고리에 맞춤
  const categoriesFixed = ['보험료', '통신/반려견', '주거/금융/구독', '생활비', '기타'];
  const categoriesVariable = ['식비/장보기', '육아/생필품', '카페/간식', '의료/건강', '쇼핑/생활', '반려견', '교통/차량', '기타'];

  let months = {};
  let currentMonth = todayMonth();
  let curMonth = { incomes: [], items: [] };  // 보고 있는 달의 데이터 (저장된 달이면 months[currentMonth] 와 같은 객체)
  let items = [];
  let incomes = [];            // 보고 있는 달의 수입 [{ id, name, amount, received }]
  let viewMode = 'list';       // 'list' | 'calendar'
  let selectedDay = new Date().getDate();  // 달력에서 고른 날
  let searchQuery = '';
  let inputRefund = false;     // 입력창에서 '환불'을 골랐는지
  let editingIncomeId = null;  // 수정 중인 수입 id
  let members = [];            // 구매자 [{ id, name }]
  let inputWho = null;         // 입력창에서 고른 구매자 id
  let currentTab = 'all';      // 'all' | 'fixed' | 'variable'
  let currentFilter = 'all';   // 'all' | 'unchecked' | 'checked'
  let inputType = 'variable';
  let inputCard = false;       // 입력창에서 고른 결제수단이 신용카드인지
  let editingId = null;        // 수정 중인 항목 id (null 이면 새 항목)
  let formFromEdit = false;    // 입력창에 수정하던 항목 내용이 남아 있는지
  let selectedCategory = categoriesVariable[0];

  const $ = id => document.getElementById(id);

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { console.error(e); }
  }

  function init() {
    // 테마: 기존 파일에서 라이트로 저장했으면 따르고, 없으면 기기 설정을 따른다
    const savedTheme = safeGet(THEME_KEY);
    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    checkStorage();
    loadMembers();
    loadMonths();

    const savedTab = safeGet(TAB_KEY);
    if (['all', 'fixed', 'variable', 'card'].includes(savedTab)) currentTab = savedTab;
    if (safeGet(VIEW_KEY) === 'calendar') viewMode = 'calendar';
    applySummaryCollapsed(safeGet(SUMMARY_KEY) === '1');

    setupInputs();
    setInputType('variable');
    selectMonth(todayMonth());

    // 안드로이드가 탭을 새로 불러오면 기록은 남고 창은 닫힌 채로 열린다. 창 기록이 남아 있으면 되돌린다
    if (history.state && history.state.budgetGuard) history.replaceState({ budget: 'guard' }, '');  // 이전 버전 기록
    if (isState('sheet')) {
      poppingSheet = true;
      history.back();
    }
  }

  // 파일을 여는 방식(주소)에 따라 브라우저 저장이 막히는 경우가 있어서, 실제로 써 보고 읽어서 확인한다.
  // 더보기 메뉴에는 지금 주소와 저장된 데이터 개수를 보여줘서, 다시 열었을 때 같은 곳인지 확인할 수 있게 한다
  function checkStorage() {
    let ok = false;
    try {
      const probe = String(Date.now());
      localStorage.setItem('__budget_probe', probe);
      ok = localStorage.getItem('__budget_probe') === probe;
      localStorage.removeItem('__budget_probe');
    } catch (e) { ok = false; }
    $('storageWarn').hidden = ok;

    let firstOpened = safeGet('split_mobile_budget_first_opened');
    if (ok && !firstOpened) {
      firstOpened = new Date().toLocaleString('ko-KR');
      safeSet('split_mobile_budget_first_opened', firstOpened);
    }
    $('storageInfo').innerText = ok
      ? `저장: 이 브라우저에 저장 중 (이 주소로 처음 연 시각 ${firstOpened})\n주소: ${decodeURI(location.href)}`
      : `저장: 안 됨\n주소: ${decodeURI(location.href)}`;
  }

  // 예시용 가짜 데이터의 id. 실제 기록이 아니므로 불러올 때 버린다
  // (기존 mobile_budget.html 의 f1~v5, 이전 v2 의 '숫자-s숫자')
  function isSampleId(id) {
    return /^[fv]\d$/.test(id) || /-s\d+$/.test(id);
  }

  function loadMonths() {
    const saved = safeGet(MONTHS_KEY);
    months = {};
    if (saved) {
      try { months = JSON.parse(saved) || {}; } catch (e) { months = {}; }
    } else {
      // 처음 실행: 기존 파일에서 직접 입력한 항목이 있으면 이번 달로 가져온다
      try {
        const oldItems = JSON.parse(safeGet(OLD_STORAGE_KEY) || '[]').filter(it => !isSampleId(it.id));
        if (oldItems.length) {
          oldItems.forEach(it => { if (!it.type) it.type = 'variable'; });
          months[todayMonth()] = { income: parseInt(safeGet(OLD_INCOME_KEY), 10) || 0, items: oldItems };
        }
      } catch (e) { /* 기존 데이터가 깨져 있으면 빈 상태로 시작 */ }
    }

    // 예전 형식을 바꾸고 예시 데이터를 정리한다
    Object.keys(months).forEach(ym => {
      const mo = normalizeMonth(ym, months[ym]);
      mo.items = mo.items.filter(it => !isSampleId(it.id));
      if (isEmptyMonth(mo)) delete months[ym];
    });

    // 가계부.xlsx 의 7·8월 기록을 한 번만 넣는다. 그 달에 이미 입력한 게 있으면 건드리지 않는다
    if (!safeGet(EXCEL_KEY)) {
      Object.entries(excelMonths()).forEach(([ym, data]) => {
        if (!months[ym]) months[ym] = normalizeMonth(ym, data);
      });
      safeSet(EXCEL_KEY, '1');
    }
    safeSet(MONTHS_KEY, JSON.stringify(months));
  }

  // 가계부.xlsx 내용 (고정비_상세, 변동지출_내역, Sheet1 의 7월 열)
